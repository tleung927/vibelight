name: Vibelight - Windows and Android

# Builds the Vibelight Windows installer + portable ZIPs and the Android APKs.
#
# * Run it by hand: Actions -> "Vibelight - Windows and Android" -> Run workflow.
#   The files appear under the run's "Artifacts". Fill in "release_tag" (e.g. v1.1.0)
#   to also attach them to that GitHub release.
# * Push a tag like v1.2.0 and the files are attached to that release automatically
#   (the release is created if it does not exist yet).
#
# Android signing uses these repository secrets (Settings -> Secrets and variables -> Actions):
#   VIBELIGHT_KEYSTORE_B64     base64 of the release keystore (.jks)
#   VIBELIGHT_STORE_PASSWORD   keystore password
#   VIBELIGHT_KEY_PASSWORD     key password (same as the store password for PKCS12)
# Without them the APKs are signed with a throwaway key: fine for testing, but they
# cannot update an install signed with the real key.

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Also attach the files to this release tag (leave empty for artifacts only)
        required: false
        type: string
        default: ''
      build_windows:
        description: Build Windows
        type: boolean
        default: true
      build_android:
        description: Build Android
        type: boolean
        default: true

concurrency:
  group: vibelight-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out version and release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(tr -d '[:space:]' < app/version.txt)
          test -n "$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version $version, release tag '${tag:-<none>}'"

      - name: Create the release if it does not exist
        if: steps.version.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Vibelight ${TAG#v}" --notes "Vibelight ${TAG#v}" --draft
            echo "Created draft release $TAG"
          fi

  windows:
    needs: prepare
    if: github.event_name == 'push' || inputs.build_windows
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      QT_VERSION: '6.11.1'
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download dependencies
        run: powershell ./setup-deps.ps1

      - name: Install Qt (x64)
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          version: ${{ env.QT_VERSION }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Install Qt (ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          arch: win64_msvc2022_arm64_cross_compiled
          version: ${{ env.QT_VERSION }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Build x64
        shell: cmd
        env:
          QT_PATH: ${{ github.workspace }}\..\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64

      - name: Build ARM64
        shell: cmd
        env:
          QT_PATH: ${{ github.workspace }}\..\Qt\${{ env.QT_VERSION }}\msvc2022_arm64\bin
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release arm64

      - name: Build installer
        shell: cmd
        run: scripts\generate-bundle.bat Release

      - name: Rename to Vibelight
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force dist
          Copy-Item "build/installer-release/MoonlightSetup-$env:VERSION.exe" "$out/Vibelight-Setup-$env:VERSION.exe"
          Copy-Item "build/installer-x64-release/MoonlightPortable-x64-$env:VERSION.zip" "$out/Vibelight-Portable-x64-$env:VERSION.zip"
          Copy-Item "build/installer-arm64-release/MoonlightPortable-arm64-$env:VERSION.zip" "$out/Vibelight-Portable-arm64-$env:VERSION.zip"
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Vibelight-Windows-${{ env.VERSION }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

      - name: Attach to release
        if: needs.prepare.outputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  android:
    needs: prepare
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NDK_VERSION: '27.0.12077973'
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIBELIGHT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VIBELIGHT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VIBELIGHT_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/vibelight-release.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
            store_pw="$STORE_PASSWORD"
            key_pw="${KEY_PASSWORD:-$STORE_PASSWORD}"
          else
            echo "::warning::VIBELIGHT_KEYSTORE_B64 / VIBELIGHT_STORE_PASSWORD secrets are not set. Signing with a throwaway key: these APKs cannot update an install signed with the real Vibelight key."
            store_pw=$(openssl rand -hex 16)
            key_pw="$store_pw"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -alias vibelight \
              -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Vibelight CI (throwaway)" \
              -storepass "$store_pw" -keypass "$key_pw" > /dev/null
          fi
          echo "::add-mask::$store_pw"
          echo "::add-mask::$key_pw"
          {
            echo "ORG_GRADLE_PROJECT_VIBELIGHT_STORE_FILE=$keystore"
            echo "ORG_GRADLE_PROJECT_VIBELIGHT_STORE_PASSWORD=$store_pw"
            echo "ORG_GRADLE_PROJECT_VIBELIGHT_KEY_ALIAS=vibelight"
            echo "ORG_GRADLE_PROJECT_VIBELIGHT_KEY_PASSWORD=$key_pw"
          } >> "$GITHUB_ENV"

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleNonRoot_gameRelease

      - name: Rename to Vibelight
        run: |
          src=app/build/outputs/apk/nonRoot_game/release
          mkdir -p ../dist
          for pair in arm64-v8a:arm64 armeabi-v7a:armv7 x86_64:x86_64 x86:x86; do
            abi=${pair%%:*}; name=${pair##*:}
            cp "$src/app-nonRoot_game-$abi-release.apk" "../dist/Vibelight-$VERSION-android-$name.apk"
          done
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "../dist/Vibelight-$VERSION-android-arm64.apk" | head -n 3
          ls -l ../dist

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Vibelight-Android-${{ env.VERSION }}
          path: dist/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Attach to release
        if: needs.prepare.outputs.release_tag != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release upload "$TAG" dist/*.apk --clobber -R "$GITHUB_REPOSITORY"
